<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Workflow Orchestration Engine{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='theme.css') }}" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
<div class="shell">

    <aside class="sidebar" aria-label="Main navigation">
        <a href="/" class="side-brand">
            <svg class="brand-shield" viewBox="0 0 32 36" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 2L3 7v10c0 8.5 5.6 14.6 13 17 7.4-2.4 13-8.5 13-17V7L16 2z" fill="#0A2C7E" stroke="#7FA3F5" stroke-width="2.2"/>
                <path d="M16 10l1.9 4 4.4.5-3.3 3 .9 4.4L16 19.700l-3.900 2.200.9-4.400-3.300-3 4.400-.5L16 10z" fill="#FF5E4E" stroke="#FF8274" stroke-width="1"/>
            </svg>
            <span>Workflow<br>Orchestration Engine</span>
        </a>

        <nav class="side-nav">
            <a href="/dashboard" class="{{ 'active' if active_page == 'dashboard' }}">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8 2.5 11h2.7v8.7a1 1 0 0 0 1 1h4v-6h3.600v6h4a1 1 0 0 0 1-1V11h2.700L12 2.800z"/></svg>
                {{ 'Dashboard' if active_page == 'dashboard' else 'Dashboard' }}
            </a>
            <a href="/" class="{{ 'active' if active_page == 'scan' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.500" cy="10.500" r="6.500"/><line x1="20" y1="20" x2="15.300" y2="15.300"/></svg>
                Scan Configuration
            </a>
            <a href="/history" class="{{ 'active' if active_page == 'history' }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.500 14"/></svg>
                Scan History
            </a>
        </nav>

        <div class="side-slogan">
            <em>{% block slogan %}Scan smarter.<br>Stay safer.{% endblock %}</em>
            <svg viewBox="0 0 24 26" fill="currentColor"><path d="M12 1 3 4.800v6.600c0 5.600 3.700 9.800 9 11.600 5.300-1.800 9-6 9-11.600V4.800L12 1z"/><path d="M8.300 11.800l2.700 2.700 4.800-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>

    </aside>

    <div class="content-col">

        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
